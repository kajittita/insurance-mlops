stages:
  prepare:
    cmd: python -m insurance.prepare
    deps:
      - data/raw/insurance.csv
      - src/insurance/prepare.py
      - src/insurance/config.py
    outs:
      - data/processed/insurance_clean.csv

  train:
    cmd: python -m insurance.train
    deps:
      - data/processed/insurance_clean.csv
      - src/insurance/train.py
      - src/insurance/config.py
    metrics:
      - metrics/metrics.json:
          cache: false
