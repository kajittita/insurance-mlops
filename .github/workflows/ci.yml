# Runs on every push and on every pull request to main.
# The same checks as the local pre-commit hooks, plus the tests with the coverage gate and a Docker build.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  MLFLOW_DISABLE_TELEMETRY: "true"

jobs:
  checks:
    name: Lint, type check, tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run the pre-commit hooks (flake8, pyright, file checks)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run the tests (fails below 95% coverage)
        run: pytest --cov-report=xml

      - name: Save the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Build the Docker image
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t insurance-mlops:ci .

      - name: Smoke test the image
        run: docker run --rm insurance-mlops:ci python -c "import insurance.api; print('image works')"
